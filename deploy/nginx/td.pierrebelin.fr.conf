# Modèle initial, copié dans /etc/nginx/sites-available/ ; Certbot y a ensuite ajouté le bloc HTTPS
# et la redirection 80 -> 443, la version du VPS diffère donc de celle-ci.
server {
    listen 80;
    server_name td.pierrebelin.fr;

    gzip on;
    gzip_proxied any;
    gzip_types text/javascript application/javascript text/css application/json;

    # WebSocket du serveur de partie
    location /partie {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Une connexion de salon peut rester longtemps silencieuse
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Page du jeu (dist/index.html servi par Node)
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
