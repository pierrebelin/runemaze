<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runemaze</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'> <defs> <clipPath id='in'><circle cx='60' cy='60' r='46'/></clipPath> </defs> <circle cx='60' cy='60' r='56' fill='%23151b24' stroke='%23557a9e' stroke-width='2'/> <circle cx='60' cy='60' r='46' fill='%230a0d12' stroke='%23334052' stroke-width='1.5'/> <g stroke='%236fa8dc' stroke-opacity='0.7' stroke-width='1.6' stroke-linecap='round' fill='none'> <g id='r'><path d='M60 7v6M57 9l3 2 3-2'/></g> <use href='%23r' transform='rotate(45 60 60)'/><use href='%23r' transform='rotate(90 60 60)'/><use href='%23r' transform='rotate(135 60 60)'/> <use href='%23r' transform='rotate(180 60 60)'/><use href='%23r' transform='rotate(225 60 60)'/><use href='%23r' transform='rotate(270 60 60)'/><use href='%23r' transform='rotate(315 60 60)'/> </g> <g clip-path='url(%23in)' fill='%232a3546' stroke='%234a5a70' stroke-width='1'> <rect x='47' y='41' width='60' height='10' rx='2'/> <rect x='13' y='69' width='60' height='10' rx='2'/> <rect x='10' y='10' width='64' height='16' rx='2'/> <rect x='56' y='94' width='54' height='16' rx='2'/> </g> <path d='M86 4V32H34V60H86V88H44V96' fill='none' stroke='%236fa8dc' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/> <path d='M44 90l7 9-7 9-7-9z' fill='%23e9b949' stroke='%230a0d12' stroke-width='1.5'/> </svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&family=Grenze+Gotisch:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    /* Nuit d'acier : neutres bleu nuit, un seul accent bleu acier, retenu. */
    --ground: #0e1218;
    --panel: #151b24;
    --panel-2: #1d2531;
    --slot: #18202a;
    --slot-on: #233042;
    --well: #0a0d12;
    --line: #334052;
    --line-soft: #232c38;
    --accent: #6fa8dc;
    --accent-dim: #557a9e;
    --accent-ink: #06121e;
    --accent-rgb: 111, 168, 220;
    --gold: #e9b949;
    --text: #e8ecf1;
    --text-dim: #a7b0bd;
    --text-faint: #707a88;
    --good: #8cc464;
    --bad: #e0664f;
    --frost: #8fd3f2;
    --display: "Grenze Gotisch", "Palatino Linotype", Palatino, serif;
    --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
    --caps: "Alegreya Sans SC", "Alegreya Sans", "Gill Sans", sans-serif;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font: 16px/1.4 var(--body); overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  /* Rangées fixées : la barre et la console sont masquées hors partie. */
  #bar { grid-row: 1; }
  #stage { grid-row: 2; }
  #console { grid-row: 3; }

  /* Barre de ressources */
  .bar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 8px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); box-shadow: inset 0 -1px 0 #000;
  }
  .brand { font: 700 26px/1 var(--display); color: var(--accent); letter-spacing: 0.02em; margin-right: 4px; }
  .res { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .res svg { width: 18px; height: 18px; flex: none; }
  .res b { font-weight: 700; font-size: 18px; }
  .res small { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.04em; }
  .res[hidden] { display: none; }
  /* Or et éther : même allure que les vies, détail au survol. */
  .bar .pouch .chip { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; font: 500 15px var(--body); letter-spacing: 0; color: var(--text); }
  .bar .pouch .chip svg { width: 18px; height: 18px; flex: none; }
  .bar .pouch .chip b { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar .pouch .chip small { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.04em; }
  .bar .pouch:hover .chip small, .bar .pouch:focus .chip small { color: var(--text); }
  .bar .pouch .detail { right: auto; left: 0; }
  .spacer { flex: 1; }
  .next { display: flex; align-items: center; gap: 10px; }
  .briefing { position: relative; cursor: help; }
  .briefing[hidden] { display: none; }
  .briefing .chip {
    display: inline-block; font: 500 14px var(--caps); letter-spacing: 0.03em; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; white-space: nowrap;
  }
  .briefing .chip b { color: var(--text); font-weight: 500; }
  .briefing:hover .chip, .briefing:focus .chip { border-color: var(--accent-dim); }
  .briefing .detail {
    display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; width: 300px; max-width: calc(100vw - 32px);
    background: color-mix(in srgb, var(--ground) 96%, transparent); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 12px; font-size: 14px; color: var(--text-dim); box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  .briefing:hover .detail, .briefing:focus .detail { display: block; }
  .briefing .when { font: 500 13px var(--caps); color: var(--accent); letter-spacing: 0.04em; }
  .briefing h3 { margin: 0 0 4px; font: 700 17px var(--caps); color: var(--text); letter-spacing: 0.03em; }
  .briefing p { margin: 4px 0 0; }
  .briefing .facts { color: var(--text); font-variant-numeric: tabular-nums; }
  .next .timer { font: 500 14px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; min-width: 9em; text-align: right; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 12px; cursor: pointer; font: 500 14px var(--caps); letter-spacing: 0.03em;
  }
  .btn:hover { border-color: var(--accent-dim); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 700; box-shadow: 0 0 0 1px #000;
  }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.primary:disabled { filter: grayscale(0.7) brightness(0.7); cursor: wait; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .icon-btn { padding: 5px 8px; display: inline-flex; align-items: center; }
  .icon-btn svg { width: 16px; height: 16px; }
  kbd { font: 500 11px var(--caps); color: var(--text-faint); border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 4px; margin-left: 4px; }

  /* Scène */
  .stage { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; padding: 0; }
  #game { display: block; touch-action: none; cursor: default; }
  #game.building { cursor: crosshair; }
  /* Colonne droite : l'encart adverse (duel) au-dessus du panneau d'envois, jamais l'un sur l'autre. */
  .stage-side {
    position: absolute; top: 10px; right: 16px; z-index: 2; width: min(300px, calc(100% - 32px));
    max-height: calc(100% - 20px); display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .stage-side > * { pointer-events: auto; }
  .send-panel, .rival-panel {
    overflow: auto; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px #0009;
  }
  .rival-panel summary { cursor: pointer; display: flex; align-items: center; gap: 8px; font: 700 15px var(--caps); letter-spacing: 0.04em; }
  .rival-panel summary::marker { color: var(--text-dim); }
  .rival-panel .rv-nick { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rival-panel .rv-lives { display: inline-flex; align-items: center; gap: 4px; }
  .rival-panel svg { width: 18px; height: 18px; flex: none; }
  .rival-panel [id^="rivalDetail"] { margin: 8px 0; color: var(--text-dim); }
  .rv-builder { margin: 0 0 8px; color: var(--text); }
  .rv-builder span { font: 500 12px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; margin-right: 4px; }
  .rv-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rv-stat {
    display: grid; grid-template-columns: auto 1fr; grid-template-areas: "icon label" "icon value"; column-gap: 8px; align-items: center;
    padding: 6px 8px; background: var(--slot); border: 1px solid var(--line); border-radius: 4px;
  }
  .rv-stat svg { grid-area: icon; width: 22px; height: 22px; }
  .rv-stat span { grid-area: label; font: 500 11px var(--caps); letter-spacing: 0.03em; color: var(--text-dim); }
  .rv-stat strong { grid-area: value; font-weight: 600; color: var(--text); }
  .send-panel h3 { margin: 0 0 6px; font: 700 15px var(--caps); letter-spacing: 0.04em; }
  .send-panel p { margin: 0 0 4px; color: var(--text-dim); }
  .send-panel .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .send-panel .tabs button {
    flex: 1; padding: 4px 6px; background: var(--slot); border: 1px solid var(--line-soft); border-radius: 4px;
    font: 500 13px var(--caps); color: var(--text-dim); cursor: pointer;
  }
  .send-panel .tabs button.active { color: var(--text); border-color: var(--accent); background: var(--slot-on); }
  .sends { display: grid; gap: 4px; }
  .sends button {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; text-align: left; cursor: pointer;
    background: var(--slot-on); border: 1px solid var(--accent); border-radius: 4px; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .sends button:hover:not(:disabled) { background: color-mix(in srgb, var(--slot-on) 85%, var(--accent)); }
  .sends .cost { margin-left: auto; font-weight: 700; color: var(--gold); }
  .sends .gain { color: var(--good); min-width: 3ch; text-align: right; }
  .sends button:disabled { cursor: not-allowed; background: var(--well); border-color: var(--line-soft); color: var(--text-faint); }
  .sends button:disabled .cost { color: var(--bad); }
  .sends button:disabled .gain { color: var(--text-faint); }
  .toast {
    position: absolute; z-index: 6; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: color-mix(in srgb, var(--ground) 92%, transparent); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 14px; font-size: 15px; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    max-width: calc(100% - 32px); text-align: center; white-space: pre-line;
  }
  .toast.show { opacity: 1; }
  .toast.bad { border-color: var(--bad); color: #ffd2c8; }

  /* Console du bas, à la manière de Warcraft III */
  .console {
    /* Hauteur fixe : la toile se redimensionnerait (et la vue se recentrerait) à chaque changement de grille. */
    display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) auto; grid-template-rows: 133px; gap: 12px;
    padding: 10px 16px 12px; background: var(--panel); border-top: 1px solid var(--line); box-shadow: inset 0 1px 0 #000;
  }
  .unit { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
  #portrait { width: 72px; height: 72px; flex: none; background: var(--well); border: 1px solid var(--line); border-radius: 3px; }
  .unit h2 { margin: 0; font: 700 20px/1.1 var(--display); color: var(--text); letter-spacing: 0.01em; text-wrap: balance; }
  .unit .sub { font: 500 13px var(--caps); color: var(--accent-dim); letter-spacing: 0.04em; margin-top: 2px; }
  .unit .facts { font-size: 14px; color: var(--text-dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hpbar { height: 6px; background: var(--well); border: 1px solid var(--line-soft); margin-top: 6px; width: 150px; max-width: 100%; }
  .hpbar i { display: block; height: 100%; background: var(--good); }

  .info {
    min-width: 0; font-size: 15px; color: var(--text-dim); border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
    padding: 0 14px; overflow-y: auto;
  }
  .info h3 { margin: 0 0 3px; font: 700 15px var(--caps); color: var(--text); letter-spacing: 0.04em; }
  .info p { margin: 0 0 4px; max-width: 64ch; }
  .info p.bad { color: var(--bad); }
  .info p.route { color: var(--accent); }
  .info .stats { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--text); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .info .stats span em { font-style: normal; color: var(--text-faint); font: 500 13px var(--caps); letter-spacing: 0.03em; margin-right: 4px; }
  .tag { display: inline-block; font: 500 12px var(--caps); letter-spacing: 0.04em; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; margin-right: 4px; color: var(--text); }
  .tag.good { border-color: #4f6e36; color: #b6e08f; }
  .tag.bad { border-color: #7a3a2c; color: #f0a594; }
  .tag.air { border-color: #3c6f8c; color: var(--frost); }

  .card { display: grid; grid-template-columns: repeat(4, 76px); grid-auto-rows: 64px; gap: 5px; align-content: start; }
  .slot {
    position: relative; background: var(--slot); border: 1px solid var(--line); border-radius: 3px; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7px; overflow: hidden;
  }
  .slot:hover:not(.empty) { border-color: var(--accent); }
  .slot.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--slot-on); }
  .slot.empty { cursor: default; background: transparent; border-color: transparent; }
  .slot img, .slot svg { width: 36px; height: 36px; flex: none; }
  .slot .name {
    max-width: calc(100% - 6px); margin-top: 2px; font: 500 12px/1.2 var(--body); color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot.active .name, .slot:hover .name { color: var(--text); }
  .slot .hk { position: absolute; left: 3px; top: 1px; font: 700 11px var(--caps); color: var(--accent); }
  .slot .cost {
    position: absolute; right: 3px; top: 2px; display: flex; align-items: center; gap: 2px;
    font: 700 12px/1 var(--body); color: var(--text); text-shadow: 0 1px 0 #000; font-variant-numeric: tabular-nums;
  }
  /* Pièce d'or devant le prix. */
  .slot .cost::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 35%, #fff3b0 0 18%, var(--gold) 40%, #a8781c 100%);
    box-shadow: 0 0 0 1px #6b4a0e, 0 1px 1px #000;
  }
  .slot.poor img { filter: grayscale(0.8) brightness(0.6); }
  .slot.poor .cost { color: var(--bad); }
  .slot.poor .cost::before { filter: grayscale(0.7) brightness(0.7); }

  /* Écrans superposés */
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    background: color-mix(in srgb, var(--well) 80%, transparent); z-index: 5; overflow-y: auto;
  }
  .sheet {
    box-sizing: border-box; width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 0 0 1px #000, 0 24px 60px rgba(0,0,0,0.6); padding: 32px; margin: auto;
    border-top: 2px solid var(--accent);
  }
  .sheet.small { width: min(420px, 100%); }
  .sheet-head { text-align: center; margin-bottom: 24px; }
  .sheet-head:last-child { margin-bottom: 0; }
  .sheet .sheet-head h1 { margin: 0 auto; }
  .sheet-head .logo { display: block; width: 112px; height: 112px; margin: 0 auto 12px; filter: drop-shadow(0 6px 18px rgba(var(--accent-rgb), 0.25)); }
  .sheet .sheet-head .lede { max-width: 50ch; margin: 12px auto 0; }
  .block { background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; padding: 18px 20px; margin: 0 0 18px; }
  .row.actions { justify-content: center; margin-top: 24px; }
  .sheet.wide { width: min(1100px, 100%); }
  .sheet ol.block { padding-left: 38px; }
  .sheet.wide ol { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); column-gap: 32px; }
  .sheet h1 {
    width: fit-content; margin: 0; font: 700 64px/0.95 var(--display); color: var(--accent); letter-spacing: 0.01em;
  }
  /* Accueil et préparation : la carte tirée reste visible derrière un voile nocturne. */
  .overlay.home {
    background:
      radial-gradient(70% 60% at 50% 0%, rgba(var(--accent-rgb), 0.12), transparent 70%),
      color-mix(in srgb, var(--ground) 62%, transparent);
    backdrop-filter: blur(2px);
  }
  .start-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line-soft); }
  .sheet .start-links .btn { font-size: 14px; padding: 6px 14px; color: var(--text-dim); background: transparent; text-decoration: none; }
  .sheet .start-links .btn:hover { color: var(--text); }
  .sheet.start { width: min(760px, 100%); }
  .start-ways { display: grid; gap: 14px; }
  .start-ways .block { margin: 0; }
  .start .block h2 { margin: 0 0 6px; font: 700 26px/1 var(--display); color: var(--text); }
  .start .block p:not(.label) { margin: 0; color: var(--text-dim); }
  .solo { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .solo .play-row { flex: none; flex-direction: column; align-items: stretch; }
  .start .multi h2 { margin-bottom: 14px; }
  .multi .field { max-width: none; margin-bottom: 14px; }
  .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
  .multi .modes { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 16px; }
  .multi .diff { padding: 8px 12px; }
  .multi .diff strong { font-size: 20px; }
  .duel-ways { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
  .multi .or { font: 500 13px var(--caps); letter-spacing: 0.06em; color: var(--text-faint); }
  .sheet ol li::marker { color: var(--accent); font-weight: 700; }
  .sheet h2 { margin: 0 0 6px; font: 700 34px/1 var(--display); color: var(--text); }
  .sheet .lede { margin: 6px 0 18px; color: var(--text-dim); font-size: 17px; }
  .sheet ol { margin: 0 0 18px; padding-left: 20px; color: var(--text-dim); display: grid; gap: 4px; }
  .sheet ol b { color: var(--text); font-weight: 500; }
  .label { font: 700 13px var(--caps); letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0 8px; }
  .diffs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
  .diff { text-align: left; background: var(--slot); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; }
  .diff:hover { border-color: var(--accent-dim); }
  .diff[aria-checked="true"] { border-color: var(--accent); background: var(--slot-on); box-shadow: 0 0 0 1px var(--accent); }
  .diff:disabled { cursor: default; }
  .diff:disabled:not([aria-checked="true"]) { opacity: 0.55; border-color: var(--line); }
  .builders { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .builder {
    display: grid; justify-items: center; gap: 6px; text-align: center;
    background: var(--slot); border: 1px solid var(--line); border-radius: 4px; padding: 12px 8px 10px; cursor: pointer; color: var(--text);
  }
  .builder:hover { border-color: var(--accent-dim); }
  .builder .crest { width: 52px; height: 61px; color: var(--hue, var(--accent)); }
  .builder .crest .ink { fill: var(--slot); stroke: var(--slot); }
  .builder[aria-checked="true"] .crest .ink { fill: var(--slot-on); stroke: var(--slot-on); }
  /* Fiche détaillée : infobulle au-dessus de la case, au survol du blason ou au focus clavier. */
  .builder { position: relative; }
  .builder-info {
    display: none; position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: 240px; z-index: 6;
    padding: 8px 12px; text-align: left; pointer-events: none;
    background: var(--ground); border: 1px solid var(--hue, var(--line));
    border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  .builder .crest:hover ~ .builder-info, .builder:focus-visible .builder-info { display: block; }
  /* Aux bords de la grille, l'infobulle s'aligne sur la case pour ne pas déborder de la fiche. */
  .builder:first-child .builder-info { left: 0; transform: none; }
  .builder:last-child .builder-info { left: auto; right: 0; transform: none; }
  .builder[aria-checked="true"] { border-color: var(--accent); background: var(--slot-on); box-shadow: 0 0 0 1px var(--accent); }
  .builder h3 { margin: 0; color: var(--hue, var(--text)); font: 700 15px/1.15 var(--caps); letter-spacing: 0.03em; }
  .builder { border-top: 2px solid var(--hue, var(--line)); }
  .builder[aria-checked="true"] { border-color: var(--hue, var(--accent)); box-shadow: 0 0 0 1px var(--hue, var(--accent)); }
  [data-builder="bastion"] { --hue: #8fa6c8; }
  [data-builder="forge"] { --hue: #d29468; }
  [data-builder="sylve"] { --hue: #8dbb84; }
  [data-builder="pyromancers"] { --hue: #d77a6c; }
  [data-builder="necromancers"] { --hue: #93bba3; }
  [data-builder="guild"] { --hue: #7fb7b9; }
  [data-builder="sanctuary"] { --hue: #c8cfe0; }
  [data-builder="arcanists"] { --hue: #ad97d6; }
  .builder-info p { margin: 0 0 4px; font-size: 13px; color: var(--text-dim); }
  .builder-info em { display: block; font-style: normal; font-size: 11px; text-transform: uppercase; color: var(--accent-dim); }
  .diff strong { display: block; font: 700 22px var(--display); color: var(--text); }
  .diff span { display: block; font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  /* Carte tirée : miniature à gauche ; à droite biome et tirage, effet, puis chiffres calés en bas à hauteur de la miniature. */
  .maps {
    display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: 20px; margin-bottom: 18px;
    background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; padding: 14px; text-align: left;
  }
  .map-thumb { width: 288px; height: 192px; border: 1px solid var(--line-soft); border-radius: 3px; display: block; }
  .map-info { display: grid; grid-template-rows: auto auto 1fr; gap: 12px; min-width: 0; }
  .map-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .biomes { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .biome {
    font: 700 18px/1 var(--display); color: var(--text-dim); background: transparent; border: 0; padding: 9px 18px; cursor: pointer;
  }
  .biome + .biome { border-left: 1px solid var(--line); }
  .biome:hover { color: var(--text); }
  .biome[aria-checked="true"] { color: var(--text); background: var(--slot-on); box-shadow: inset 0 -2px 0 var(--accent); }
  .map-head .btn { font-size: 14px; padding: 8px 14px; }
  .map-biome { margin: 0; font: 700 22px/1 var(--display); color: var(--text); }
  .map-effect { margin: 0; color: var(--text-dim); font-size: 15px; line-height: 1.4; }
  .map-facts {
    align-self: end; margin: 0; padding-top: 12px; border-top: 1px solid var(--line-soft);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 12px;
  }
  .map-facts div { display: flex; flex-direction: column-reverse; gap: 2px; }
  .map-facts dd { margin: 0; font: 700 26px/1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .map-facts dt { font: 500 12px/1.2 var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sheet .btn { font-size: 16px; padding: 8px 18px; }
  .field { display: grid; gap: 4px; max-width: 260px; margin-bottom: 12px; }
  .field span { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  .sheet input[type="text"] {
    min-width: 0; background: var(--well); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 12px; font: 500 16px var(--body); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }
  .sheet input[type="text"]::placeholder { color: var(--text-faint); }
  .sheet input[type="text"]:hover { border-color: var(--accent-dim); }
  .sheet input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 0 1px var(--accent); }
  .code-join { display: flex; gap: 8px; }
  .code-join input[type="text"] {
    flex: 1; width: 0; text-transform: uppercase; text-align: center;
    font: 700 18px var(--body); letter-spacing: 0.3em; font-variant-numeric: lining-nums tabular-nums;
  }
  .code-join input[type="text"]::placeholder { letter-spacing: 0.2em; }
  .lobby-code { text-align: center; }
  .lobby-code .label { margin-bottom: 4px; }
  .lobby-code .code { margin: 0; font: 700 32px/1.1 var(--body); letter-spacing: 0.3em; color: var(--accent); font-variant-numeric: lining-nums tabular-nums; }
  .roster .diff, .roster .diff:hover { cursor: default; border-color: var(--line); }
  .endstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin: 14px 0 20px; }
  .endstats div { background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; padding: 12px 14px; text-align: center; }
  .endstats b { display: block; font: 700 26px var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
  .endstats span { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  .debrief { margin-bottom: 18px; }
  table.scoreboard { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
  table.scoreboard th, table.scoreboard td { padding: 7px 12px; border-bottom: 1px solid var(--line-soft); text-align: right; }
  table.scoreboard thead th { font: 700 13px var(--caps); letter-spacing: 0.04em; color: var(--text); }
  table.scoreboard tbody th { text-align: left; font-weight: 400; color: var(--text-dim); }
  table.scoreboard td { color: var(--text-dim); }
  table.scoreboard td.best { color: var(--accent); font-weight: 700; }
  table.scoreboard td.best::before { content: "★ "; font-size: 11px; vertical-align: 1px; }
  .duel-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); margin-bottom: 14px; }
  .duel-tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--text-dim); font: 500 14px var(--caps); letter-spacing: 0.03em; padding: 6px 14px; cursor: pointer; border-radius: 4px 4px 0 0; }
  .duel-tab:hover { color: var(--text); }
  .duel-tab.active { color: var(--accent); border-color: var(--line-soft); background: var(--slot); }
  .sheet ol.debrief-towers { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
  .debrief-tower { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; }
  .debrief-tower img { width: 40px; height: 40px; background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; }
  .debrief-tower p { margin: 0; }
  .debrief-tower b { color: var(--text); font-weight: 500; }
  .debrief-fate { font: 500 12px var(--caps); color: var(--text-faint); letter-spacing: 0.03em; margin-left: 6px; }
  .debrief-track { height: 6px; background: var(--well); border-radius: 3px; margin: 4px 0; }
  .debrief-bar { height: 100%; min-width: 2px; background: var(--accent); border-radius: 3px; }
  .debrief-note { margin: 0; font-size: 14px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .debrief-chart { display: flex; align-items: flex-end; gap: 3px; height: 64px; padding: 6px; background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; }
  .debrief-col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .debrief-col div { width: 100%; min-height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
  .debrief-axis { display: flex; justify-content: space-between; margin: 4px 0 6px; font: 500 12px var(--caps); color: var(--text-faint); letter-spacing: 0.03em; }
  .debrief-breakers { margin: 0; font-size: 14px; color: var(--text-dim); }
  .table-wrap { overflow-x: auto; margin: 6px 0 16px; }
  table.armor { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; min-width: 520px; }
  table.armor th, table.armor td { border: 1px solid var(--line-soft); padding: 4px 8px; text-align: center; }
  table.armor th { font: 500 12px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  table.armor td.g { color: #b6e08f; background: rgba(90, 130, 60, 0.18); }
  table.armor td.b { color: #f0a594; background: rgba(150, 60, 40, 0.18); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; color: var(--text-dim); margin-bottom: 16px; }
  .keys kbd { margin: 0; font-size: 13px; color: var(--text); padding: 1px 6px; }
  .diffs .diff { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; padding: 7px 12px; }
  .diffs .diff strong { display: inline; font-size: 17px; }
  .diffs .diff span { display: inline; }
  .diffs .diff .record { margin: 0 0 0 auto; }
  .record { font: 500 12px var(--caps); color: var(--accent); letter-spacing: 0.03em; margin-top: 4px; }

  @media (max-width: 860px) {
    .console { grid-template-columns: minmax(0, 1fr) auto; }
    .info { display: none; }
  }
  @media (max-width: 560px) {
    .bar { gap: 8px 14px; padding: 6px 12px; }
    .brand { font-size: 22px; }
    .next .timer { min-width: 0; }
    .console { grid-template-columns: 1fr; grid-template-rows: none; gap: 8px; padding: 8px 12px 10px; }
    .card { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 58px; min-height: 121px; }
    .slot img, .slot svg { width: 30px; height: 30px; }
    .bar .pouch .chip small { display: none; }
    #portrait { width: 52px; height: 52px; }
    .unit h2 { font-size: 18px; }
    .stage { padding: 6px 8px; }
    .next { flex-wrap: wrap; }
    .sheet { padding: 20px 16px; }
    .endstats { grid-template-columns: repeat(2, 1fr); }
    .sheet h1 { font-size: 48px; }
    .diffs { grid-template-columns: 1fr; }
    .maps { grid-template-columns: 1fr; }
    .map-thumb { width: 100%; height: auto; }
    .solo { flex-direction: column; align-items: stretch; }
    .multi .modes, .duel-ways { grid-template-columns: 1fr; }
    .multi .or { text-align: center; }
    kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="bar">
    <span class="brand">Runemaze</span>
    <span class="res" title="Vies">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17s-7-4.3-7-9.2A3.8 3.8 0 0110 5.6a3.8 3.8 0 017 2.2C17 12.7 10 17 10 17z" fill="#d8553f" stroke="#6e2419" stroke-width="1.2"/></svg>
      <b id="lives">0</b>
    </span>
    <span class="briefing pouch" id="goldPouch" tabindex="0">
      <span class="chip"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#e9b949" stroke="#8a6320" stroke-width="1.5"/><path d="M10 5.5v9M7.5 7.5h4a1.6 1.6 0 010 3.2h-3a1.6 1.6 0 000 3.2h4" fill="none" stroke="#8a6320" stroke-width="1.4"/></svg><span id="goldChip"></span></span>
      <span class="detail" id="goldDetail"></span>
    </span>
    <span class="briefing pouch" id="etherPouch" tabindex="0" hidden>
      <span class="chip" id="etherChip"></span>
      <span class="detail" id="etherDetail">Éther produit par les glaneurs, dépensé en envois et en niveaux de porte.</span>
    </span>
    <span class="res" id="waveRes"><small>Vague</small> <b id="wave">0</b></span>
    <span class="spacer"></span>
    <span class="next"><span class="timer" id="timer"></span></span>
    <button class="btn" id="sendBtn" type="button" title="Envois (T)" hidden>Envois<kbd>T</kbd></button>
    <button class="btn icon-btn" id="pauseBtn" type="button" aria-label="Pause" title="Pause (P)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg>
    </button>
    <button class="btn icon-btn" id="muteBtn" type="button" aria-label="Couper le son" title="Son (M)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path id="muteWave" d="M11 5.5a3.5 3.5 0 010 5M12.8 3.5a6 6 0 010 9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="btn icon-btn" id="helpBtn" type="button" aria-label="Aide" title="Aide (H)">?</button>
    <button class="btn" id="resignBtn" type="button">Quitter la partie</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="game" aria-label="Carte du jeu"></canvas>
    <div class="stage-side" id="stageSide">
      <aside class="send-panel" id="sendPanel" aria-label="Envois" hidden></aside>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <footer class="console" id="console">
    <section class="unit" aria-live="polite">
      <canvas id="portrait" width="144" height="144"></canvas>
      <div id="unitText"></div>
    </section>
    <section class="info" id="info"></section>
    <section class="card" id="card" aria-label="Commandes"></section>
  </footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
