<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&family=Grenze+Gotisch:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #14110d;
    --panel: #1d1914;
    --panel-2: #262019;
    --slot: #211c16;
    --line: #4a3d29;
    --line-soft: #342c20;
    --bronze: #b98d4c;
    --gold: #e9b949;
    --text: #efe3c4;
    --text-dim: #b3a78b;
    --text-faint: #857a63;
    --good: #8cc464;
    --bad: #e0664f;
    --frost: #8fd3f2;
    --display: "Grenze Gotisch", "Palatino Linotype", Palatino, serif;
    --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
    --caps: "Alegreya Sans SC", "Alegreya Sans", "Gill Sans", sans-serif;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font: 16px/1.4 var(--body); overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  /* Rangées fixées : la barre et la console sont masquées hors partie. */
  #bar { grid-row: 1; }
  #stage { grid-row: 2; }
  #console { grid-row: 3; }

  /* Barre de ressources */
  .bar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 8px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); box-shadow: inset 0 -1px 0 #000;
  }
  .brand { font: 700 26px/1 var(--display); color: var(--gold); letter-spacing: 0.02em; margin-right: 4px; }
  .res { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .res svg { width: 18px; height: 18px; flex: none; }
  .res b { font-weight: 700; font-size: 18px; }
  .res small { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.04em; }
  .spacer { flex: 1; }
  .next { display: flex; align-items: center; gap: 10px; }
  .briefing { position: relative; cursor: help; }
  .briefing[hidden] { display: none; }
  .briefing .chip {
    display: inline-block; font: 500 14px var(--caps); letter-spacing: 0.03em; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; white-space: nowrap;
  }
  .briefing .chip b { color: var(--text); font-weight: 500; }
  .briefing:hover .chip, .briefing:focus .chip { border-color: var(--bronze); }
  .briefing .detail {
    display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; width: 300px; max-width: calc(100vw - 32px);
    background: rgba(20, 16, 11, 0.96); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 12px; font-size: 14px; color: var(--text-dim); box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  .briefing:hover .detail, .briefing:focus .detail { display: block; }
  .briefing .when { font: 500 13px var(--caps); color: var(--gold); letter-spacing: 0.04em; }
  .briefing h3 { margin: 0 0 4px; font: 700 17px var(--caps); color: var(--text); letter-spacing: 0.03em; }
  .briefing p { margin: 4px 0 0; }
  .briefing .facts { color: var(--text); font-variant-numeric: tabular-nums; }
  .next .timer { font: 500 14px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; min-width: 9.5em; text-align: right; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 12px; cursor: pointer; font: 500 14px var(--caps); letter-spacing: 0.03em;
  }
  .btn:hover { border-color: var(--bronze); }
  .btn.primary { background: #3a2c14; border-color: var(--bronze); color: var(--gold); }
  .btn.primary:hover { background: #4a3818; }
  .btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .seg { display: flex; }
  .seg .btn { border-radius: 0; margin-left: -1px; padding: 5px 9px; }
  .seg .btn:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .seg .btn:last-child { border-radius: 0 4px 4px 0; }
  .icon-btn { padding: 5px 8px; display: inline-flex; align-items: center; }
  .icon-btn svg { width: 16px; height: 16px; }
  kbd { font: 500 11px var(--caps); color: var(--text-faint); border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 4px; margin-left: 4px; }

  /* Scène */
  .stage { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; padding: 10px 16px; }
  #game { display: block; border: 1px solid var(--line); box-shadow: 0 0 0 1px #000, 0 12px 30px rgba(0,0,0,0.5); touch-action: none; cursor: default; }
  #game.building { cursor: crosshair; }
  .toast {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: rgba(20, 16, 11, 0.92); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 14px; font-size: 15px; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.bad { border-color: var(--bad); color: #ffd2c8; }

  /* Console du bas, à la manière de Warcraft III */
  .console {
    display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) auto; gap: 12px;
    padding: 10px 16px 12px; background: var(--panel); border-top: 1px solid var(--line); box-shadow: inset 0 1px 0 #000;
  }
  .unit { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
  #portrait { width: 72px; height: 72px; flex: none; background: #0f0d0a; border: 1px solid var(--line); border-radius: 3px; }
  .unit h2 { margin: 0; font: 700 20px/1.1 var(--display); color: var(--text); letter-spacing: 0.01em; text-wrap: balance; }
  .unit .sub { font: 500 13px var(--caps); color: var(--bronze); letter-spacing: 0.04em; margin-top: 2px; }
  .unit .facts { font-size: 14px; color: var(--text-dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hpbar { height: 6px; background: #0d0b08; border: 1px solid var(--line-soft); margin-top: 6px; width: 150px; max-width: 100%; }
  .hpbar i { display: block; height: 100%; background: var(--good); }

  .info {
    min-width: 0; font-size: 15px; color: var(--text-dim); border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
    padding: 0 14px; max-height: 132px; overflow-y: auto;
  }
  .info h3 { margin: 0 0 3px; font: 700 15px var(--caps); color: var(--text); letter-spacing: 0.04em; }
  .info p { margin: 0 0 4px; max-width: 64ch; }
  .info .stats { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--text); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .info .stats span em { font-style: normal; color: var(--text-faint); font: 500 13px var(--caps); letter-spacing: 0.03em; margin-right: 4px; }
  .tag { display: inline-block; font: 500 12px var(--caps); letter-spacing: 0.04em; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; margin-right: 4px; color: var(--text); }
  .tag.good { border-color: #4f6e36; color: #b6e08f; }
  .tag.bad { border-color: #7a3a2c; color: #f0a594; }
  .tag.air { border-color: #3c6f8c; color: var(--frost); }

  .card { display: grid; grid-template-columns: repeat(4, 56px); grid-auto-rows: 56px; gap: 5px; }
  .slot {
    position: relative; background: var(--slot); border: 1px solid var(--line); border-radius: 3px; padding: 0; cursor: pointer;
    display: grid; place-items: center; overflow: hidden;
  }
  .slot:hover:not(.empty) { border-color: var(--gold); }
  .slot.active { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: #2e2615; }
  .slot.empty { cursor: default; background: #19150f; border-color: var(--line-soft); }
  .slot img, .slot svg { width: 40px; height: 40px; }
  .slot .hk { position: absolute; left: 3px; top: 1px; font: 700 11px var(--caps); color: var(--gold); }
  .slot .cost { position: absolute; right: 3px; bottom: 1px; font: 700 12px var(--body); color: var(--text); text-shadow: 0 1px 0 #000; font-variant-numeric: tabular-nums; }
  .slot.poor img { filter: grayscale(0.8) brightness(0.6); }
  .slot.poor .cost { color: var(--bad); }

  /* Écrans superposés */
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(12, 10, 7, 0.78); z-index: 5; overflow-y: auto;
  }
  .sheet {
    box-sizing: border-box; width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 0 0 1px #000, 0 24px 60px rgba(0,0,0,0.6); padding: 24px 26px; margin: auto;
  }
  .sheet h1 { margin: 0; font: 700 64px/0.95 var(--display); color: var(--gold); letter-spacing: 0.01em; }
  .sheet h2 { margin: 0 0 6px; font: 700 34px/1 var(--display); color: var(--text); }
  .sheet .lede { margin: 6px 0 18px; color: var(--text-dim); font-size: 17px; }
  .sheet ol { margin: 0 0 18px; padding-left: 20px; color: var(--text-dim); display: grid; gap: 4px; }
  .sheet ol b { color: var(--text); font-weight: 500; }
  .label { font: 700 13px var(--caps); letter-spacing: 0.06em; color: var(--bronze); margin: 0 0 8px; }
  .diffs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
  .diff { text-align: left; background: var(--slot); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; }
  .diff:hover { border-color: var(--bronze); }
  .diff[aria-checked="true"] { border-color: var(--gold); background: #2e2615; }
  .builders { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; text-align: left; }
  .builder { text-align: left; background: var(--slot); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; color: var(--text); }
  .builder:hover { border-color: var(--bronze); }
  .builder[aria-checked="true"] { border-color: var(--gold); background: #2e2615; }
  .builder h3 { margin: 0 0 4px; }
  .builder p { margin: 0 0 4px; font-size: 13px; color: var(--text-dim); }
  .builder em { display: block; font-style: normal; font-size: 11px; text-transform: uppercase; color: var(--bronze); }
  .diff strong { display: block; font: 700 22px var(--display); color: var(--text); }
  .diff span { display: block; font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .maps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
  .map { display: grid; justify-items: center; gap: 6px; text-align: center; background: var(--slot); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; }
  .map:hover { border-color: var(--bronze); }
  .map[aria-checked="true"] { border-color: var(--gold); background: #2e2615; }
  .map-thumb { width: 64px; height: 64px; border: 1px solid var(--line-soft); border-radius: 3px; }
  .map span { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sheet .btn { font-size: 16px; padding: 8px 18px; }
  .mode-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .mode-tab {
    background: none; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; margin-bottom: -1px;
    padding: 8px 18px; cursor: pointer; font: 700 16px var(--caps); letter-spacing: 0.04em; color: var(--text-dim);
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab[aria-selected="true"] { color: var(--gold); background: var(--panel-2); border-color: var(--line); }
  .field { display: grid; gap: 4px; max-width: 260px; margin-bottom: 12px; }
  .field span { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  .sheet input[type="text"] {
    min-width: 0; background: #120f0b; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 12px; font: 500 16px var(--body); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }
  .sheet input[type="text"]::placeholder { color: var(--text-faint); }
  .sheet input[type="text"]:hover { border-color: var(--bronze); }
  .sheet input[type="text"]:focus { outline: none; border-color: var(--gold); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 0 1px var(--gold); }
  .duel-way { display: flex; flex-direction: column; gap: 6px; background: var(--slot); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px; }
  .duel-way .maps, .duel-way .diffs { margin-bottom: 8px; }
  .duel-way h3 { margin: 0; font: 700 22px var(--display); color: var(--text); }
  .duel-way p { margin: 0 0 4px; font-size: 14px; color: var(--text-dim); }
  .duel-way p.label { margin: 4px 0 0; color: var(--bronze); font-size: 13px; }
  .duel-way > .btn { align-self: flex-start; }
  .code-join { display: flex; gap: 8px; }
  .code-join input[type="text"] {
    flex: 1; width: 0; text-transform: uppercase; text-align: center;
    font: 700 18px var(--body); letter-spacing: 0.3em; font-variant-numeric: lining-nums tabular-nums;
  }
  .code-join input[type="text"]::placeholder { letter-spacing: 0.2em; }
  .endstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0 20px; }
  .endstats div { background: var(--slot); border: 1px solid var(--line-soft); border-radius: 4px; padding: 8px 10px; }
  .endstats b { display: block; font: 700 26px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
  .endstats span { font: 500 13px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  .debrief-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); margin-bottom: 10px; }
  .debrief-tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--text-dim); font: 500 13px var(--caps); letter-spacing: 0.03em; padding: 6px 12px; cursor: pointer; border-radius: 4px 4px 0 0; }
  .debrief-tab:hover { color: var(--text); }
  .debrief-tab.active { color: var(--gold); border-color: var(--line-soft); background: var(--slot); }
  .debrief-panel { max-height: 220px; overflow-y: auto; margin-bottom: 16px; }
  table.debrief-towers, table.debrief-waves { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
  table.debrief-towers th, table.debrief-towers td, table.debrief-waves th, table.debrief-waves td { border: 1px solid var(--line-soft); padding: 4px 8px; text-align: right; }
  table.debrief-towers th:first-child, table.debrief-towers td:first-child, table.debrief-waves th:first-child, table.debrief-waves td:first-child { text-align: left; }
  table.debrief-towers th, table.debrief-waves th { font: 500 12px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  .debrief-family { display: grid; grid-template-columns: 100px 1fr auto auto; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; color: var(--text-dim); }
  .debrief-family span:last-child, .debrief-family span:nth-child(3) { font-variant-numeric: tabular-nums; color: var(--text); }
  .debrief-bar { height: 10px; background: var(--gold); border-radius: 2px; }
  .debrief-breakers { margin: 0; color: var(--text-dim); }
  .table-wrap { overflow-x: auto; margin: 6px 0 16px; }
  table.armor { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; min-width: 520px; }
  table.armor th, table.armor td { border: 1px solid var(--line-soft); padding: 4px 8px; text-align: center; }
  table.armor th { font: 500 12px var(--caps); color: var(--text-dim); letter-spacing: 0.03em; }
  table.armor td.g { color: #b6e08f; background: rgba(90, 130, 60, 0.18); }
  table.armor td.b { color: #f0a594; background: rgba(150, 60, 40, 0.18); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; color: var(--text-dim); margin-bottom: 16px; }
  .keys kbd { margin: 0; font-size: 13px; color: var(--text); padding: 1px 6px; }
  .record { font: 500 12px var(--caps); color: var(--gold); letter-spacing: 0.03em; margin-top: 4px; }

  @media (max-width: 860px) {
    .console { grid-template-columns: minmax(0, 1fr) auto; }
    .info { display: none; }
  }
  @media (max-width: 560px) {
    .bar { gap: 8px 14px; padding: 6px 12px; }
    .brand { font-size: 22px; }
    .hide-sm { display: none; }
    .next .timer { min-width: 0; }
    .console { grid-template-columns: 1fr; gap: 8px; padding: 8px 12px 10px; }
    .card { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 48px; }
    #portrait { width: 52px; height: 52px; }
    .unit h2 { font-size: 18px; }
    .stage { padding: 6px 8px; }
    .next { flex-wrap: wrap; }
    .briefing .detail { right: auto; left: 0; }
    .sheet { padding: 20px 18px; }
    .sheet h1 { font-size: 46px; }
    .sheet { padding: 18px; }
    .sheet h1 { font-size: 48px; }
    .diffs { grid-template-columns: 1fr; }
    .maps { grid-template-columns: 1fr; }
    kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="bar">
    <span class="brand">Tower Defense</span>
    <span class="res" title="Or">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#e9b949" stroke="#8a6320" stroke-width="1.5"/><path d="M10 5.5v9M7.5 7.5h4a1.6 1.6 0 010 3.2h-3a1.6 1.6 0 000 3.2h4" fill="none" stroke="#8a6320" stroke-width="1.4"/></svg>
      <b id="gold">0</b>
    </span>
    <span class="res" title="Vies">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17s-7-4.3-7-9.2A3.8 3.8 0 0110 5.6a3.8 3.8 0 017 2.2C17 12.7 10 17 10 17z" fill="#d8553f" stroke="#6e2419" stroke-width="1.2"/></svg>
      <b id="lives">0</b>
    </span>
    <span class="res"><small>Vague</small> <b id="wave">0</b><small id="waveMax">/ 30</small></span>
    <span class="res hide-sm" title="Longueur du trajet terrestre, en cases"><small>Labyrinthe</small> <b id="maze">0</b></span>
    <span class="spacer"></span>
    <span class="next">
      <span class="briefing" id="briefing" tabindex="0" hidden>
        <span class="chip" id="briefingChip"></span>
        <span class="detail" id="briefingDetail"></span>
      </span>
      <span class="timer"><span class="hide-sm" id="timerLabel"></span><span id="timer"></span></span>
      <button class="btn primary" id="callBtn" type="button">Appeler<kbd>Espace</kbd></button>
    </span>
    <span class="seg" role="group" aria-label="Vitesse de jeu">
      <button class="btn" type="button" data-speed="1" aria-pressed="true">x1</button>
      <button class="btn" type="button" data-speed="2" aria-pressed="false">x2</button>
      <button class="btn" type="button" data-speed="3" aria-pressed="false">x3</button>
    </span>
    <button class="btn" id="sendBtn" type="button" title="Envois (T)" hidden>Envois<kbd>T</kbd></button>
    <button class="btn icon-btn" id="pauseBtn" type="button" aria-label="Pause" title="Pause (P)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg>
    </button>
    <button class="btn icon-btn" id="muteBtn" type="button" aria-label="Couper le son" title="Son (M)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path id="muteWave" d="M11 5.5a3.5 3.5 0 010 5M12.8 3.5a6 6 0 010 9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="btn icon-btn" id="helpBtn" type="button" aria-label="Aide" title="Aide (H)">?</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="game" aria-label="Carte du jeu"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <footer class="console" id="console">
    <section class="unit" aria-live="polite">
      <canvas id="portrait" width="144" height="144"></canvas>
      <div id="unitText"></div>
    </section>
    <section class="info" id="info"></section>
    <section class="card" id="card" aria-label="Commandes"></section>
  </footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
